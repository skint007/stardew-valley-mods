# Reusable workflow: build a single mod and, on push to main, publish a release if its
# manifest version hasn't been released yet. Called once per changed mod from ci.yml.
name: Build mod

on:
  workflow_call:
    inputs:
      name:
        description: Display name (used in the release title).
        required: true
        type: string
      dir:
        description: Mod folder, relative to the repo root (e.g. levelup).
        required: true
        type: string
      tag_prefix:
        description: Tag/release prefix for this mod (e.g. levelup -> levelup-v1.0.0).
        required: true
        type: string
      nexus_file_group_id:
        description: >-
          Nexus Mods file group ID to publish new versions to. Leave empty to skip the
          Nexus upload (e.g. for mods not published under your own page).
        required: false
        type: string
        default: ''
    secrets:
      NEXUS_API_KEY:
        description: Nexus Mods API key. Only needed when nexus_file_group_id is set.
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      # Read the version out of the mod's manifest and derive the release tag.
      - name: Read manifest version
        id: meta
        shell: bash
        run: |
          version="$(jq -r .Version "${{ inputs.dir }}/manifest.json")"
          echo "version=$version"                              >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag_prefix }}-v$version"        >> "$GITHUB_OUTPUT"

      # Compile. EnableModDeploy=false so CI doesn't overwrite your installed copy; the
      # Mod Build package still produces the release .zip under bin/Release.
      - name: Build
        shell: bash
        run: |
          csproj="$(ls "${{ inputs.dir }}"/*.csproj | head -n1)"
          dotnet build "$csproj" -c Release -p:EnableModDeploy=false

      # Only consider releasing on a push to main. On PRs this (and the steps below) are
      # skipped, so PRs just build to validate.
      - name: Check whether this version is already released
        id: check
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.meta.outputs.tag }} already exists - skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate packaged zip
        id: pkg
        if: ${{ steps.check.outputs.should_release == 'true' }}
        shell: bash
        run: |
          zip="$(find "${{ inputs.dir }}/bin/Release" -name '*.zip' | head -n1)"
          if [ -z "$zip" ]; then echo "No .zip produced by the build" >&2; exit 1; fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: ${{ steps.check.outputs.should_release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ inputs.name }} v${{ steps.meta.outputs.version }}
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true

      # Publish the new version to Nexus Mods (only for mods that pass a file group ID, i.e.
      # ones published under your own page). Uses the official Nexus v3 upload API action.
      # NOTE: that API is currently flagged "evaluation only" by Nexus, so treat this as beta.
      # NOTE: this sets the FILE version only. Nexus's headline "mod version" must still be
      # bumped by hand on the mod page (the v3 API has no endpoint for it; tracked upstream at
      # Nexus-Mods/upload-action#11). Keep it in sync: SMAPI's update check reads the headline
      # version, so users aren't notified of the new file until the mod version matches.
      - name: Publish to Nexus Mods
        if: ${{ steps.check.outputs.should_release == 'true' && inputs.nexus_file_group_id != '' }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.5
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_group_id: ${{ inputs.nexus_file_group_id }}
          filename: ${{ steps.pkg.outputs.zip }}
          version: ${{ steps.meta.outputs.version }}
          display_name: ${{ inputs.name }} ${{ steps.meta.outputs.version }}
          file_category: main
          archive_existing_file: true
